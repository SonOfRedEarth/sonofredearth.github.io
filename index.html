<!DOCTYPE html>
<html>
<head>
  <title>Something is Coming...</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      margin: 0;
    }

    .box {
      max-width: 800px;
      padding: 20px;
    }

    h1 {
      font-size: 3em;
    }

    p {
      font-size: 1.3em;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="box" id="content"></div>

<script>

const unlockDate = new Date("2026-07-2T00:00:00");

const now = new Date();

const content = document.getElementById("content");

if (now >= unlockDate) {

  content.innerHTML = `
    <h1>🎉 Happy Birthday! 🎉</h1>

    <p>
      You unlocked the surprise!
    </p>

    <p>
      Put your real message here.
    </p>
  `;

} else {

  content.innerHTML = `
    <h1>🚧 UNDER CONSTRUCTION 🚧</h1>

    <p>
      Something special is being prepared...
    </p>

    <p>
      Come back later.
    </p>
  `;

}

</script>

</body>
</html>
